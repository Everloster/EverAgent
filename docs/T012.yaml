apiVersion: everagent.io/v1
kind: Task
metadata:
  id: T012
  project: global
  created_at: 2026-06-21
spec:
  type: maintenance
  target: "github-trending-analyzer 周报自动化"
  value: |
    周报自动化的全部要素：
    - scripts/weekly_trending_report.py (脚本，可手动运行或 cron/launchd)
    - scripts/launchd/com.github-trending-analyzer.weekly.plist.template
      (macOS LaunchAgent 模板，周日 09:17 自动触发)
    - 手动运行：
        python3 github-trending-analyzer/scripts/weekly_trending_report.py
        python3 github-trending-analyzer/scripts/weekly_trending_report.py --dispatch
    - 自动生成：
        github-trending-reports/all-weekly-summary-YYYY-MM-DD.md
        github-trending-reports/all-weekly-summary-YYYY-MM-DD.json
    - 安装 LaunchAgent 见 plist.template 顶部注释
    - 历史上 2026-05 月报缺失是因本任务未完成导致；现已完成，
      2026-06 周报已成功生成（19 repos / 68,814 weekly stars）
  priority: P3
  resources:
    max_tokens: 10000
    expected_duration: 30m
  qualityGates:
    - check: markdown_report
      required: true
    - check: json_summary
      required: true
    - check: trend_comparison_with_q1
      required: false
  retryPolicy:
    maxRetries: 1
    backoff: fixed