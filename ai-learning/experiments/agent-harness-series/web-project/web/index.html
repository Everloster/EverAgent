<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Card Gallery · Agent 演义演示</title>
<style>
:root{color-scheme:light;--ink:#183c3b;--muted:#657976;--line:#dae5df}*{box-sizing:border-box}body{margin:0;background:#f3f7f4;color:var(--ink);font:16px/1.6 system-ui,sans-serif}.shell{max-width:1100px;margin:auto;padding:50px 36px}.eyebrow{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#438479}h1{font-size:42px;line-height:1.2;margin:12px 0}p{color:var(--muted)}.toolbar{display:grid;grid-template-columns:1fr 190px;gap:16px;margin:32px 0 18px}label{display:block;font-size:14px;font-weight:600}input,select{display:block;width:100%;margin-top:8px;padding:12px 14px;font:inherit;border:1px solid #bdcfc5;border-radius:9px;background:white;color:var(--ink)}input:focus,select:focus{outline:3px solid #a3d7c7}#status{min-height:30px;color:var(--muted);font-size:14px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:16px 0 28px}.card{padding:25px;background:white;border:1px solid var(--line);border-radius:14px;min-height:165px}.tag{display:inline-block;padding:2px 9px;border-radius:12px;background:#e4f0e9;color:#377365;font-size:12px}.card h2{font-size:22px;margin:14px 0 6px}.card p{margin:0}.pager{display:flex;gap:14px;align-items:center}button{padding:10px 20px;border-radius:8px;border:1px solid #b9cbc1;background:white;color:var(--ink);font:inherit;cursor:pointer}button:disabled{opacity:.45;cursor:default}.note{border-top:1px solid var(--line);margin-top:38px;padding-top:18px;font-size:13px}@media(max-width:600px){.shell{padding:24px 20px}.toolbar,.cards{grid-template-columns:1fr}h1{font-size:32px}}
</style></head><body><main class="shell"><div class="eyebrow">Agent 演义 · 自拟开发项目</div><h1>Card Gallery</h1><p>一个包含前端、搜索 API 与集成测试的演示工作区。搜索、标签与分页共享一份明确的功能合同。</p>
<div class="toolbar"><label for="search">搜索标题与描述<input id="search" placeholder="例如 search 或 中文" autocomplete="off"></label><label for="category">标签<select id="category"><option value="">全部标签</option><option value="api">API</option><option value="ui">UI</option><option value="docs">Docs</option></select></label></div>
<div id="status" role="status" aria-live="polite">正在加载</div><section id="cards" class="cards" aria-label="卡片结果"></section><nav class="pager" aria-label="分页"><button id="prev">上一页</button><span id="pageLabel"></span><button id="next">下一页</button></nav>
<p class="note">本页是自拟演示项目；并非 Orca 或 T3 的产品界面，也不是模型完成任务的记录。</p></main>
<script>
const search=document.querySelector('#search'),category=document.querySelector('#category'),cards=document.querySelector('#cards'),status=document.querySelector('#status');let page=1,sequence=0,timer;
async function load(){const current=++sequence;status.textContent='正在加载';const query=new URLSearchParams({q:search.value,tag:category.value,page:String(page)});try{const response=await fetch('/api/cards?'+query);if(!response.ok)throw new Error('API 返回 '+response.status);const data=await response.json();if(current!==sequence)return;cards.replaceChildren();for(const item of data.items){const node=document.createElement('article');node.className='card';const tag=document.createElement('span');tag.className='tag';tag.textContent=item.tag.toUpperCase();const title=document.createElement('h2');title.textContent=item.title;const desc=document.createElement('p');desc.textContent=item.description;node.append(tag,title,desc);cards.append(node)}status.textContent=data.total?'找到 '+data.total+' 条结果':'没有匹配结果';document.querySelector('#pageLabel').textContent='第 '+data.page+' 页';document.querySelector('#prev').disabled=page===1;document.querySelector('#next').disabled=page*data.pageSize>=data.total}catch(error){if(current===sequence){status.textContent='加载失败：'+error.message;cards.replaceChildren()}}}
search.addEventListener('input',()=>{page=1;sequence++;clearTimeout(timer);timer=setTimeout(load,150)});category.addEventListener('change',()=>{page=1;load()});document.querySelector('#prev').addEventListener('click',()=>{if(page>1){page--;load()}});document.querySelector('#next').addEventListener('click',()=>{page++;load()});load();
</script></body></html>
