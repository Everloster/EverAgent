spec:
  type: text_analysis
  target: 美学三论：康德《判断力批判》+ 杜威《艺术即经验》+ Danto《艺术的终结》
  value: "文本精读 + 比较美学三论：\n- 康德《判断力批判》(Kritik der Urteilskraft, 1790)：先验哲学的\"桥梁\"、无利害的快感、\n\
    \  自由美 vs 依存美、崇高（数学的崇高 vs 力学的崇高）、天才论、审美理念 vs 理性理念\n- 杜威《艺术即经验》(Art as Experience,\
    \ 1934)：实用主义美学、\"一个经验\"(an experience)、\n  艺术与日常经验的连续性、手段-目的统一、\"做\"与\"受\"的节律\n\
    - 阿瑟·丹托《艺术的终结》(The End of Art, 1984-1997)：黑格尔式命题、艺术史叙事的终结、\n  任何物都可以是艺术品（沃霍尔 Brillo\
    \ Box）、艺术转向自我意识、后历史阶段\n三家对比：无利害 vs 连续性 vs 终结；自律美学 vs 经验美学 vs 哲学美学；\n对当代艺术 / AI\
    \ 生成的解释力。\n"
  priority: P2
