apiVersion: everagent.io/v1
kind: Task
metadata:
  id: T066
  project: psychology-learning
  created_at: 2026-06-21
spec:
  type: concept_report
  target: 情绪调节 Gross 模型 + 重评 vs 抑制的实证对比
  value: '系统梳理情绪调节的"过程模型"(Process Model of Emotion Regulation, Gross 1998-2015)：

    - 五大家族：情境选择 / 情境修正 / 注意部署 / 认知改变 / 反应调节

    - 重评 (cognitive reappraisal)：事前、antecedent-focused、长期效益

    - 抑制 (expressive suppression)：事后、response-focused、短期有效长期有害

    - 实证对比：心血管反应、皮质醇、记忆、社交功能、人际后果

    - 神经基础：前额叶 - 杏仁核通路、腹外侧 / 背外侧 PFC、dmPFC

    - 跨文化差异（东亚 vs 西方，抑制接受度）

    - 临床应用：焦虑症、抑郁、PTSD、边缘人格的 DBT 中情绪调节模块

    - 与正念 / ACT / CBT 情绪模块的关系

    - 元分析 (Webb, Miles & Sheeran 2012; Aldao et al. 2010) 量化效应量

    '
  priority: P2
  resources:
    max_tokens: 45000
    expected_duration: 2h
  qualityGates:
  - check: frontmatter_complete
    required: true
  - check: evidence_graded
    required: true
  - check: mermaid_diagrams
    required: true
  - check: meta_analysis_cited
    required: true
  retryPolicy:
    maxRetries: 1
    backoff: fixed
