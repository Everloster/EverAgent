  target: World Models / JEPA 路线深度报告：自监督世界建模 vs 生成式建模
  value: '系统对比 2024-2026 世界模型两大技术路线：

    - LeCun JEPA 路线 (Meta FAIR 2022-2025)：能量函数、嵌入空间预测、Sparsh-K et al. V-JEPA 2 (2025.06,
    1.2B params, 1M+ hours video)、I-JEPA / MC-JEPA 衍生

    - 生成式路线 (Sora / Genie / Cosmos / Veo 2024-2026)：diffusion transformer 视频生成、可控性、潜空间动力学模型

    - 关键对比：训练目标（reconstruct pixel vs predict embedding）、推理范式（一步生成 vs 自回归 rollout）、可规划性、可控生成、数据效率

    - 应用场景：自动驾驶（Wayve GAIA-1/2, Tesla world model）、机器人（NVIDIA Cosmos, Genie 2/3, DreamerV3）、游戏/具身

    - MIT 2026 AI 三主线之一（已覆盖 T043 摘要），本报告深化 world models 路线对比

    '
