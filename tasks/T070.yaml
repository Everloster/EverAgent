apiVersion: everagent.io/v1
kind: Task
metadata:
  id: T070
  project: github-trending-analyzer
  status: open
  created_at: 2026-06-21
spec:
  type: maintenance
  target: "2026 Q2 GitHub 趋势月报（5/6 月）"
  value: |
    按 github-trending-analyzer 的月度汇报规范：
    - 抓取 2026-05-01 ~ 2026-06-21 的 trending 仓库
    - 按语言 / 类别 / star 增速排名，输出 Markdown 月报
    - 与 2026 Q1 月报对比：什么新出现了、什么消失了
    - 重点 Repo 简评（top 10），含技术栈、应用场景
    - JSON 摘要（机器可读）
    - 同步到 github-trending-analyzer/github-trending-reports/2026-05/ 和 2026-06/
  priority: P2
  resources:
    max_tokens: 40000
    expected_duration: 1.5h
  qualityGates:
    - check: markdown_report
      required: true
    - check: json_summary
      required: true
    - check: top10_review
      required: true
    - check: trend_comparison_with_q1
      required: true
  retryPolicy:
    maxRetries: 1
    backoff: fixed
