spec:
  type: knowledge_report
  target: "推理模型三大流派详解：OpenAI o-series × DeepSeek R1 × Claude Extended Thinking"
  value: |
    拆解 2024-2026 推理时计算（Test-Time Compute）的三种代表性技术路径：
    - OpenAI o-series (o1 preview 2024.09 → o1 2024.12 → o3 2025.04 → o4-mini 2025.04)：CoT 强化学习、process reward model (PRM)、deliberative alignment、tool use during thinking
    - DeepSeek R1 / R1-Zero (2025.01, R1-Lite-Preview 2024.11 → R1 2025.01 → R1-0528 2025.05 → R2 2025.Q3?)：纯 RL（GRPO）、规则化奖励、可读 CoT 蒸馏、self-evolution
    - Anthropic Claude Extended Thinking (Claude 3.7 Sonnet 2025.02 → Claude 4.5 2025.11 → Claude Opus 4.7 2026.Q1?)：交错 thinking/tool use、adaptive thinking budget、effort parameter、thinking trace visibility
    对比维度：训练范式（PRM/RL/DPO）、推理范式（一次/自适应 budget）、可解释性（暴露 trace vs 隐式）、工具调用时机、benchmark 表现（AIME/HumanEval/MATH/SWE-bench）、成本结构（token 倍率 vs 延迟）、安全姿态（deliberative alignment vs thinking 净化）。
    学术 + 实战双视角；每条路线给出代表论文、官方说明、API 用法、典型 prompt pattern。
  priority: P1
  resources:
    max_tokens: 55000
    expected_duration: 2.5h
