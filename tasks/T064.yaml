apiVersion: everagent.io/v1
kind: Task
metadata:
  id: T064
  project: cs-learning
  status: open
  created_at: 2026-06-21
spec:
  type: paper_analysis
  target: "RFC 9000 QUIC: A UDP-Based Multiplexed and Secure Transport"
  value: |
    精读 IETF RFC 9000 (2021.05) + RFC 9001 (TLS 1.3 over QUIC) + RFC 9221 (QUIC over datagrams) + RFC 9298 (QUIC v2)：
    - 核心动机：解决 HTTP/2 over TCP 的 HoL 阻塞、TLS+TCP 三次握手延迟
    - 协议设计：UDP 之上、自带加密（TLS 1.3 内嵌）、流复用、连接迁移（conn ID 抗 NAT rebind）
    - 关键机制：ack-eliciting frames、loss recovery、congestion control (PBB / Cubic / BBR)、0-RTT、path validation
    - 性能特性：HTTP/3 实测延迟 vs HTTP/2 over TLS 1.3、Mobile / 高丢包场景优势
    - 生态：Cloudflare / Google / Meta / Apple 全栈部署、LetsEncrypt 支持、curl/nghttp2/hyper 库
  priority: P1
  resources:
    max_tokens: 50000
    expected_duration: 2h
  qualityGates:
    - check: frontmatter_complete
      required: true
    - check: evidence_graded
      required: true
    - check: mermaid_diagrams
      required: true
    - check: rfc_citation
      required: true
  retryPolicy:
    maxRetries: 1
    backoff: fixed
