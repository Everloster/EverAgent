name: EverAgent quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/everagent-core/go.mod
          cache-dependency-path: packages/everagent-core/go.sum
      - name: Test shared core and public quality contracts
        run: go -C packages/everagent-core test -mod=readonly ./...
      - name: Vet shared core and public quality contracts
        run: go -C packages/everagent-core vet -mod=readonly ./...
      - name: Check the committed snapshot with the same public gate
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          [[ "$BASE_REVISION" =~ ^[0-9a-f]{40,64}$ ]] || exit 1
          if [[ "$BASE_REVISION" =~ ^0+$ ]]; then
            BASE_REVISION=$(git hash-object -w -t tree --stdin </dev/null)
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE_REVISION=$(git merge-base "$BASE_REVISION" HEAD)
          fi
          go -C packages/everagent-core run -mod=readonly -trimpath -buildvcs=false \
            ./cmd/ea-quality quick --scope head --base "$BASE_REVISION"

  # Retained authoring/research tools are separate from the Go commit gate.
  report-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GitHub research test dependencies
        run: |
          python3 - <<'PY'
          import pathlib
          import subprocess
          import sys
          import tomllib
          project = tomllib.loads(pathlib.Path("github-trending-analyzer/pyproject.toml").read_text())["project"]
          dependencies = project["dependencies"] + project["optional-dependencies"]["dev"]
          subprocess.run([sys.executable, "-m", "pip", "install", *dependencies], check=True)
          PY
      - name: Run retained report authoring and research tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Run retained experiment script tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Run Bilibili inbox tests
        run: python3 -m unittest discover -s web-surfing/skills/site-bilibili/tests -p 'test_*.py'
      - name: Run GitHub research tests
        run: python3 -m pytest github-trending-analyzer/tests -q
